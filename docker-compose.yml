services:
  postgres:
    image: postgres:16-alpine
    container_name: find-trining-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-appdb}
      POSTGRES_USER: ${DB_USERNAME:-app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-app}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - find_trining_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-app} -d ${POSTGRES_DB:-appdb}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  backend:
    image: find-training-backend:1.0
    build:
      context: ./backend/find_trining
      dockerfile: Dockerfile
    environment:
      APP_NAME: find_trining
      SERVER_PORT: 8080
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-appdb}
      DB_USERNAME: ${DB_USERNAME:-app}
      DB_PASSWORD: ${DB_PASSWORD:-app}
      JPA_DDL_AUTO: none
      DB_POOL_MAX: 10
      DB_POOL_MIN: 2
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8085}:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    image: find-training-frontend:1.0
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8081}:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  find_trining_pgdata: