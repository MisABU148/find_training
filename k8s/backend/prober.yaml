apiVersion: v1
kind: ConfigMap
metadata:
  name: prober-script
data:
  prober.py: |
    import time, threading, urllib.request
    from http.server import BaseHTTPRequestHandler, HTTPServer

    URL = "http://backend:8080/api/training-slots?gymId=3"
    state = {"ok": 0, "dur": 0.0}

    def probe():
        while True:
            start = time.time()
            try:
                with urllib.request.urlopen(URL, timeout=5) as r:
                    state["ok"] = 1 if 200 <= r.status < 400 else 0
            except Exception:
                state["ok"] = 0
            state["dur"] = time.time() - start
            time.sleep(10)

    class H(BaseHTTPRequestHandler):
        def do_GET(self):
            body = (
                "# TYPE probe_success gauge\n"
                f"probe_success {state['ok']}\n"
                "# TYPE probe_duration_seconds gauge\n"
                f"probe_duration_seconds {state['dur']}\n"
            ).encode()
            self.send_response(200)
            self.send_header("Content-Type", "text/plain")
            self.end_headers()
            self.wfile.write(body)
        def log_message(self, *a):
            pass

    threading.Thread(target=probe, daemon=True).start()
    HTTPServer(("", 8000), H).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prober
spec:
  replicas: 1
  selector:
    matchLabels: {app: prober}
  template:
    metadata:
      labels: {app: prober}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: prober
          image: python:3.12-alpine
          command: ["python", "/app/prober.py"]
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: script
              mountPath: /app
      volumes:
        - name: script
          configMap:
            name: prober-script