apiVersion: v1
kind: ConfigMap
metadata:
  name: alertmanager-config
data:
  alertmanager.yml: |
    route:
      receiver: telegram
      group_by: [alertname]
      group_wait: 10s
      group_interval: 1m
      repeat_interval: 1h
      routes:
        - matchers: [severity="critical"]
          receiver: telegram
          group_wait: 0s
          repeat_interval: 30m
    receivers:
      - name: telegram
        telegram_configs:
          - bot_token: "BOT_TOKEN"
            chat_id: CHAT_ID
            parse_mode: HTML
            message: '{{ template "tg.message" . }}'
    templates:
      - /etc/alertmanager/alert.tmpl
  alert.tmpl: |
    {{ define "tg.message" -}}
    {{ if eq .Status "firing" }}🔥 <b>FIRING</b>{{ else }}✅ <b>RESOLVED</b>{{ end }}
    {{ range .Alerts }}
    <b>{{ .Labels.alertname }}</b> [{{ .Labels.severity }}]
    {{ .Annotations.summary }}
    {{ .Annotations.description }}
    {{ end }}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
spec:
  replicas: 1
  selector:
    matchLabels: {app: alertmanager}
  template:
    metadata:
      labels: {app: alertmanager}
    spec:
      containers:
        - name: alertmanager
          image: prom/alertmanager:v0.27.0
          args:
            - --config.file=/etc/alertmanager/alertmanager.yml
          ports:
            - containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/alertmanager
      volumes:
        - name: config
          configMap:
            name: alertmanager-config
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
spec:
  selector: {app: alertmanager}
  ports:
    - port: 9093
      targetPort: 9093