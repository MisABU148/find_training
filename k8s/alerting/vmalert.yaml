apiVersion: v1
kind: ConfigMap
metadata:
  name: vmalert-rules
data:
  alerts.yml: |
    groups:
      - name: service
        interval: 15s
        rules:
          - alert: HighErrorRate
            expr: |
              (sum(rate(http_server_requests_seconds_count{job="kubernetes-pods",uri!~"/actuator.*",status=~"5.."}[5m])) or vector(0))
              /
              sum(rate(http_server_requests_seconds_count{job="kubernetes-pods",uri!~"/actuator.*"}[5m]))
              > 0.01
            for: 1m
            labels:
              severity: critical
            annotations:
              summary: "Доля ошибок 5xx больше 1%"
              description: "Сейчас {{ $value | humanizePercentage }} запросов завершаются ошибкой"

          - alert: BookingFailuresHigh
            expr: |
              sum(increase(training_slot_booked_total{job="kubernetes-pods"}[5m]))
              /
              (
                sum(increase(training_slot_booked_total{job="kubernetes-pods"}[5m]))
                + (sum(increase(training_slot_booking_failed_total{job="kubernetes-pods"}[5m])) or vector(0))
              ) < 0.97
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Успешных записей на тренировку меньше 97%"
              description: "Доля успешных записей: {{ $value | humanizePercentage }}"

      - name: runtime
        interval: 15s
        rules:
          - alert: JvmHeapHigh
            expr: |
              sum by (instance) (jvm_memory_used_bytes{job="kubernetes-pods",area="heap"})
              /
              sum by (instance) (jvm_memory_max_bytes{job="kubernetes-pods",area="heap"} > 0)
              > 0.85
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Heap JVM заполнен больше чем на 85%"
              description: "{{ $labels.instance }}: {{ $value | humanizePercentage }}"

          - alert: HikariPoolSaturated
            expr: |
              hikaricp_connections_active{job="kubernetes-pods"}
              / hikaricp_connections_max{job="kubernetes-pods"} > 0.8
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: "Пул соединений с БД занят больше чем на 80%"
              description: "{{ $labels.instance }}: {{ $value | humanizePercentage }}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
spec:
  replicas: 1
  selector:
    matchLabels: {app: vmalert}
  template:
    metadata:
      labels: {app: vmalert}
    spec:
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:latest
          args:
            - -rule=/etc/vmalert/alerts.yml
            - -datasource.url=http://victoria-metrics:8428
            - -notifier.url=http://alertmanager:9093
            - -evaluationInterval=15s
          ports:
            - containerPort: 8880
          volumeMounts:
            - name: rules
              mountPath: /etc/vmalert
      volumes:
        - name: rules
          configMap:
            name: vmalert-rules
---
apiVersion: v1
kind: Service
metadata:
  name: vmalert
spec:
  selector: {app: vmalert}
  ports:
    - port: 8880
      targetPort: 8880