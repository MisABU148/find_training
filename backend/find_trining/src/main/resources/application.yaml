spring:
  application:
    name: ${APP_NAME:find_trining}

  # Фактор IX (Disposability): даём приложению корректно завершить
  # начатые запросы и закрыть пул соединений перед остановкой.
  lifecycle:
    timeout-per-shutdown-phase: 20s

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # Фактор XII (Admin processes): миграции выполняются самим приложением
  # при старте, отдельного ручного шага не требуется.
  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful
  tomcat:
    threads:
      max: ${SERVER_THREADS_MAX:200}

# Фактор XI (Logs): пишем только в stdout (event stream), без файловых
# аппендеров - куда эти логи попадут дальше, решает среда выполнения,
# а не приложение.
logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    m.ilyina.find_trining: ${LOG_LEVEL_APP:DEBUG}
